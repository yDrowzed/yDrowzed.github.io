<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly GPS - Real World Edition</title>

    <!-- Leaflet (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Ably (Multiplayer em Tempo Real) -->
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }

        /* HUD Superior */
        .hud-top {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 12px 15px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; gap: 6px; width: 220px;
        }
        .hud-title { font-weight: bold; color: #1e293b; font-size: 14px; }
        .hud-money { color: #16a34a; font-weight: bold; font-size: 18px; }
        .hud-stats { font-size: 11px; color: #64748b; }

        /* Botão de Scan Manual */
        .scan-btn {
            background: #6366f1; color: white; border: none; padding: 6px 10px;
            border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .scan-btn:hover { background: #4f46e5; }
        .scan-btn:disabled { background: #94a3b8; cursor: not-allowed; }

        /* Chat */
        .chat-container {
            position: absolute; bottom: 20px; right: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); width: 280px; height: 220px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex; flex-direction: column;
        }
        .chat-messages {
            flex: 1; padding: 10px; overflow-y: auto; font-size: 12px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .chat-messages span { padding: 4px 8px; border-radius: 6px; background: #f1f5f9; width: fit-content; }
        .chat-input { display: flex; border-top: 1px solid #e2e8f0; }
        .chat-input input { flex: 1; padding: 8px; border: none; outline: none; border-bottom-left-radius: 12px; font-size: 12px; }
        .chat-input button { padding: 8px 12px; background: #6366f1; color: white; border: none; cursor: pointer; border-bottom-right-radius: 12px; font-weight: bold; }

        /* Popups de Compra */
        .buy-btn {
            background: #10b981; color: white; border: none; padding: 6px 12px;
            border-radius: 6px; cursor: pointer; margin-top: 8px; width: 100%; font-weight: bold;
        }
        .tag-category { background: #e0e7ff; color: #4338ca; padding: 2px 6px; border-radius: 4px; font-size: 10px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="hud-top">
        <div class="hud-title">🌍 <span id="player-name">Carregando...</span></div>
        <div class="hud-money">R$ <span id="money-display">15.000</span></div>
        <div class="hud-stats">Empresas: <span id="companies-display">0</span> | <span id="online-display">0 Online</span></div>
        <button id="scan-button" class="scan-btn" onclick="triggerManualScan()">🔍 Escanear Região</button>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chat-box"></div>
        <div class="chat-input">
            <input type="text" id="chat-msg" placeholder="Chat do jogo..." onkeypress="handleEnter(event)" />
            <button onclick="sendChat()">Enviar</button>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // --- 1. CONFIGURAÇÕES E ESTADO DO JOGO ---
        const ABLY_KEY = 'SUA_API_KEY_DO_ABLY'; // Insira sua chave da API do Ably
        const playerName = prompt("Nome do seu investidor:") || "Investidor_" + Math.floor(Math.random() * 100);
        const myDeviceId = playerName + '-' + Math.random().toString(36).substring(2, 6);
        
        document.getElementById('player-name').innerText = playerName;

        let myMoney = 15000;
        let myCompaniesCount = 0;
        let myCoords = null;
        let firstLocation = true;

        const companies = {};
        const companyMarkers = {};
        const playerMarkers = {};

        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let myMarker = null;

        const companyIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/2830/2830305.png',
            iconSize: [28, 28]
        });

        // --- 2. COMUNICAÇÃO EM TEMPO REAL (ABLY) ---
        const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: myDeviceId });
        const channel = ably.channels.get('monopoly-gps-v4');

        ably.connection.on('connected', () => {
            channel.presence.enter({ name: playerName });
            addLog("Sistema", "Conectado ao servidor do jogo!");
        });

        channel.presence.subscribe(() => {
            channel.presence.get((err, members) => {
                if (!err) document.getElementById('online-display').innerText = `${members.length} Online`;
            });
        });

        channel.subscribe('game-event', (msg) => {
            const data = msg.data;

            if (data.type === 'move' && data.id !== myDeviceId) {
                if (!playerMarkers[data.id]) {
                    playerMarkers[data.id] = L.circleMarker([data.coords.lat, data.coords.lng], { color: 'red', radius: 8 })
                        .addTo(map).bindPopup(`<b>${data.name}</b>`);
                } else {
                    playerMarkers[data.id].setLatLng([data.coords.lat, data.coords.lng]);
                }
            }

            if (data.type === 'new-company') {
                registerCompany(data.company);
            }

            if (data.type === 'purchase') {
                if (companies[data.companyId]) {
                    companies[data.companyId].owner = data.buyerName;
                    updateCompanyPopup(data.companyId);
                    addLog("Mercado", `💰 ${data.buyerName} comprou ${companies[data.companyId].name}!`);
                }
            }

            if (data.type === 'chat') {
                addLog(data.name, data.message);
            }
        });

        // --- 3. INTEGRAÇÃO COM A API DE MAPAS (OVERPASS KUMI HTTPS) ---
        let isScanning = false;

        function triggerManualScan() {
            if (!myCoords) return alert("Aguardando localização do GPS...");
            fetchRealPlacesFromAPI(myCoords);
        }

        async function fetchRealPlacesFromAPI(coords) {
            if (isScanning) return;
            
            isScanning = true;
            const btn = document.getElementById('scan-button');
            if (btn) {
                btn.disabled = true;
                btn.innerText = "⏳ Escaneando...";
            }

            addLog("Radar", "Buscando comércios reais da sua rua...");
            let placesFound = [];

            const radius = 600; // Raio de busca de 600 metros
            const query = `[out:json][timeout:10];(node["name"]["amenity"](around:${radius},${coords.lat},${coords.lng});node["name"]["shop"](around:${radius},${coords.lat},${coords.lng}););out body 15;`;
            const kumiUrl = 'https://overpass.kumi.systems/api/interpreter?data=' + encodeURIComponent(query);

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000);

                const res = await fetch(kumiUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (res.ok) {
                    const data = await res.json();
                    if (data && data.elements && data.elements.length > 0) {
                        data.elements.forEach(place => {
                            const tags = place.tags || {};
                            if (place.lat && place.lon && tags.name) {
                                const cat = tags.amenity || tags.shop || 'Comércio';
                                placesFound.push({
                                    id: 'real_' + place.id,
                                    name: tags.name,
                                    category: cat,
                                    price: calculatePrice(cat),
                                    lat: place.lat,
                                    lng: place.lon,
                                    owner: null
                                });
                            }
                        });
                    }
                }
            } catch (e) {
                console.warn("Servidor de mapas ocupado:", e);
            }

            // Fallback caso a região não possua locais cadastrados com nome
            if (placesFound.length === 0) {
                addLog("Radar", "Poucos locais mapeados na área. Gerando estabelecimentos...");
                placesFound = generateEmergencyLocalPlaces(coords);
            } else {
                addLog("Radar", `${placesFound.length} locais REAIS mapeados!`);
            }

            // Publica os locais no canal global
            placesFound.forEach(comp => {
                channel.publish('game-event', { type: 'new-company', company: comp });
            });

            setTimeout(() => {
                isScanning = false;
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = "🔍 Escanear Região";
                }
            }, 5000);
        }

        function generateEmergencyLocalPlaces(coords) {
            const comers = [
                { name: "Farmácia Central", cat: "pharmacy", price: 8000 },
                { name: "Supermercado Express", cat: "supermarket", price: 12000 },
                { name: "Padaria & Confeitaria", cat: "bakery", price: 5000 },
                { name: "Posto de Combustível", cat: "fuel", price: 9000 },
                { name: "Restaurante & Hamburgueria", cat: "restaurant", price: 6000 },
                { name: "Conveniência 24h", cat: "convenience", price: 4000 }
            ];

            return comers.map((item, idx) => {
                const angle = (idx / comers.length) * 2 * Math.PI;
                const radius = 0.0015 + (Math.random() * 0.001);
                
                return {
                    id: 'local_' + Math.floor(coords.lat * 1000) + '_' + idx,
                    name: item.name,
                    category: item.cat,
                    price: item.price,
                    lat: coords.lat + (Math.sin(angle) * radius),
                    lng: coords.lng + (Math.cos(angle) * radius),
                    owner: null
                };
            });
        }

        function calculatePrice(category) {
            const cat = category.toLowerCase();
            if (cat.includes('bank') || cat.includes('mall') || cat.includes('supermarket')) return 12000;
            if (cat.includes('pharmacy') || cat.includes('fuel')) return 8000;
            if (cat.includes('restaurant') || cat.includes('fast_food')) return 5000;
            return 3000;
        }

        // --- 4. REGISTRO E COMPRA DE EMPRESAS ---
        function registerCompany(comp) {
            if (companies[comp.id]) return;

            companies[comp.id] = comp;
            const marker = L.marker([comp.lat, comp.lng], { icon: companyIcon }).addTo(map);
            companyMarkers[comp.id] = marker;

            updateCompanyPopup(comp.id);
        }

        function updateCompanyPopup(compId) {
            const comp = companies[compId];
            const marker = companyMarkers[compId];

            let html = `<span class="tag-category">${comp.category}</span><br>`;
            html += `<b style="font-size: 14px;">${comp.name}</b><br>`;
            html += `<span style="color:#16a34a; font-weight:bold;">Preço: R$ ${comp.price.toLocaleString('pt-BR')}</span><br>`;

            if (comp.owner) {
                html += `<small style="color:#4f46e5;">Dono: <b>${comp.owner}</b></small>`;
            } else {
                html += `<button class="buy-btn" onclick="buyCompany('${comp.id}')">Comprar Local</button>`;
            }

            marker.bindPopup(html);
        }

        window.buyCompany = function(compId) {
            const comp = companies[compId];

            if (myMoney >= comp.price) {
                myMoney -= comp.price;
                myCompaniesCount++;
                document.getElementById('money-display').innerText = myMoney.toLocaleString('pt-BR');
                document.getElementById('companies-display').innerText = myCompaniesCount;

                channel.publish('game-event', {
                    type: 'purchase',
                    companyId: compId,
                    buyerName: playerName
                });

                map.closePopup();
            } else {
                alert("Saldo insuficiente para comprar este imóvel!");
            }
        };

        // --- 5. GEOLOCALIZAÇÃO E CHAT ---
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                myCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };

                if (firstLocation) {
                    map.setView([myCoords.lat, myCoords.lng], 16);
                    fetchRealPlacesFromAPI(myCoords);
                    firstLocation = false;
                }

                if (!myMarker) {
                    myMarker = L.circleMarker([myCoords.lat, myCoords.lng], { color: '#2563eb', fillColor: '#3b82f6', fillOpacity: 0.8, radius: 9 }).addTo(map).bindPopup("Você");
                } else {
                    myMarker.setLatLng([myCoords.lat, myCoords.lng]);
                }

                channel.publish('game-event', { type: 'move', id: myDeviceId, name: playerName, coords: myCoords });
            }, (err) => console.log(err), { enableHighAccuracy: true });
        }

        function sendChat() {
            const input = document.getElementById('chat-msg');
            const text = input.value.trim();
            if (text) {
                channel.publish('game-event', { type: 'chat', name: playerName, message: text });
                input.value = '';
            }
        }
        function handleEnter(e) { if (e.key === 'Enter') sendChat(); }
        function addLog(name, msg) {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<span><b>${name}:</b> ${msg}</span>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
