<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSN NextGen Hangout & X1</title>
  <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.7);
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --online: #22c55e;
      --busy: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Tela de Login */
    #login-screen {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      padding: 2.5rem;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      width: 360px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }

    #login-screen h1 { margin-bottom: 0.5rem; font-size: 1.8rem; color: var(--accent); }
    #login-screen p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }

    input, select, button {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text);
      outline: none;
    }

    button {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    button:hover { background: var(--accent-hover); color: #fff; }

    /* Layout do App */
    #app-screen {
      display: none;
      width: 90vw;
      max-width: 1000px;
      height: 85vh;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      grid-template-columns: 280px 1fr;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    }

    /* Sidebar - Usuários */
    .sidebar {
      background: rgba(15, 23, 42, 0.4);
      border-right: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 1rem;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
      position: relative;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      right: 0;
      border: 2px solid var(--bg-dark);
    }

    .status-online { background-color: var(--online); }
    .status-busy { background-color: var(--busy); }

    .users-list { flex: 1; overflow-y: auto; }
    .user-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      background: rgba(255,255,255,0.02);
    }

    .user-item .info { display: flex; align-items: center; gap: 8px; }
    .btn-x1 {
      width: auto;
      padding: 0.3rem 0.6rem;
      margin: 0;
      font-size: 0.75rem;
      background: #eab308;
    }

    /* Chat Principal */
    .chat-area {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .chat-header {
      padding: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .messages-container {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .message {
      max-width: 70%;
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .message.system {
      align-self: center;
      background: rgba(255,255,255,0.05);
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .message.other {
      align-self: flex-start;
      background: rgba(255,255,255,0.1);
    }

    .message.me {
      align-self: flex-end;
      background: var(--accent);
      color: #000;
    }

    .chat-input-area {
      padding: 1rem;
      display: flex;
      gap: 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .chat-input-area input { margin: 0; }
    .chat-input-area button { width: 100px; margin: 0; }
    .btn-nudge { width: auto; background: #ec4899; color: white; }

    /* Efeito Tremer Tela (Nudge MSN) */
    .shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
      40%, 60% { transform: translate3d(8px, 0, 0); }
    }

    /* Modais */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Jogo X1 Grid */
    .grid-x1 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 1.5rem 0;
    }

    .cell {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
    }
    .cell:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>

  <!-- Tela de Auth/Login -->
  <div id="login-screen">
    <h1>MSN NextGen</h1>
    <p>Digite sua API Key do Ably e seu apelido para entrar no Hangout.</p>
    <input type="password" id="ably-key" placeholder="Chave de API do Ably">
    <input type="text" id="username" placeholder="Seu Apelido">
    <button onclick="connectAbly()">Entrar no Hangout</button>
  </div>

  <!-- App Principal -->
  <div id="app-screen">
    <div class="sidebar">
      <div class="user-profile">
        <div class="avatar" id="my-avatar">?
          <div class="status-dot status-online"></div>
        </div>
        <div>
          <div style="font-weight: bold;" id="my-name">Usuário</div>
          <div style="font-size: 0.8rem; color: var(--text-muted);">Online</div>
        </div>
      </div>
      <h4 style="margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted);">PESSOAS ONLINE</h4>
      <div class="users-list" id="users-list"></div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <h3>Lobby Publico</h3>
        <button class="btn-nudge" onclick="sendNudge()">⚡ Chamar Atenção</button>
      </div>
      <div class="messages-container" id="messages-container"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Digite uma mensagem..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>
  </div>

  <!-- Modal de Desafio X1 -->
  <div class="modal-overlay" id="challenge-modal">
    <div class="modal-card">
      <h3 id="challenge-text">Jogador te chamou pro X1!</h3>
      <p style="color: var(--text-muted); margin: 1rem 0;">Você aceita o duelo no Jogo da Velha?</p>
      <div style="display: flex; gap: 10px;">
        <button onclick="acceptChallenge()" style="background: var(--online);">Aceitar</button>
        <button onclick="declineChallenge()" style="background: var(--busy); color: white;">Recusar</button>
      </div>
    </div>
  </div>

  <!-- Modal do Jogo X1 -->
  <div class="modal-overlay" id="game-modal">
    <div class="modal-card">
      <h2 id="game-status">Sua Vez</h2>
      <div class="grid-x1" id="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
      </div>
      <button onclick="closeGame()" style="background: var(--busy); color: white;">Sair do X1</button>
    </div>
  </div>

  <script>
    let ably, lobbyChannel, gameChannel;
    let myClientId, myUsername;
    let currentChallengerId = null;
    let currentGameRoom = null;
    let mySymbol = 'X';
    let isMyTurn = false;
    let boardState = Array(9).fill(null);

    async function connectAbly() {
      const apiKey = document.getElementById('ably-key').value.trim();
      myUsername = document.getElementById('username').value.trim();

      if (!apiKey || !myUsername) {
        alert('Por favor, informe a API Key do Ably e um Apelido.');
        return;
      }

      myClientId = 'user_' + Math.random().toString(36).substr(2, 9);

      ably = new Ably.Realtime({ key: apiKey, clientId: myClientId });

      ably.connection.on('connected', () => {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'grid';
        document.getElementById('my-name').innerText = myUsername;
        document.getElementById('my-avatar').firstChild.textContent = myUsername[0].toUpperCase();

        initLobby();
      });

      ably.connection.on('failed', () => {
        alert('Falha na conexão. Verifique sua API Key.');
      });
    }

    function initLobby() {
      lobbyChannel = ably.channels.get('hangout-lobby');

      // Presença de Usuários
      lobbyChannel.presence.enter({ username: myUsername });
      
      lobbyChannel.presence.subscribe(() => {
        updateUsersList();
      });

      // Bate-papo e Eventos Globais
      lobbyChannel.subscribe('message', (msg) => {
        appendMessage(msg.data.user, msg.data.text, msg.data.type, msg.clientId === myClientId);
      });

      lobbyChannel.subscribe('nudge', (msg) => {
        triggerNudge(msg.data.user);
      });

      lobbyChannel.subscribe('challenge', (msg) => {
        if (msg.data.targetId === myClientId) {
          currentChallengerId = msg.clientId;
          document.getElementById('challenge-text').innerText = `${msg.data.fromUser} chamou você pro X1!`;
          document.getElementById('challenge-modal').style.display = 'flex';
        }
      });
    }

    async function updateUsersList() {
      const members = await lobbyChannel.presence.get();
      const listContainer = document.getElementById('users-list');
      listContainer.innerHTML = '';

      members.forEach((member) => {
        if (member.clientId === myClientId) return;

        const userItem = document.createElement('div');
        userItem.className = 'user-item';
        userItem.innerHTML = `
          <div class="info">
            <div class="avatar" style="width: 28px; height: 28px; font-size: 0.8rem;">
              ${(member.data?.username || 'U')[0].toUpperCase()}
            </div>
            <span>${member.data?.username || 'Anônimo'}</span>
          </div>
          <button class="btn-x1" onclick="challengeUser('${member.clientId}')">X1</button>
        `;
        listContainer.appendChild(userItem);
      });
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      lobbyChannel.publish('message', { user: myUsername, text: text, type: 'text' });
      input.value = '';
    }

    function sendNudge() {
      lobbyChannel.publish('nudge', { user: myUsername });
    }

    function triggerNudge(user) {
      const app = document.getElementById('app-screen');
      app.classList.add('shake');
      appendMessage('SISTEMA', `${user} chamou a atenção de todos!`, 'system', false);
      setTimeout(() => app.classList.remove('shake'), 500);
    }

    function appendMessage(user, text, type, isMe) {
      const container = document.getElementById('messages-container');
      const div = document.createElement('div');
      
      if (type === 'system') {
        div.className = 'message system';
        div.innerText = text;
      } else {
        div.className = `message ${isMe ? 'me' : 'other'}`;
        div.innerHTML = `<strong>${isMe ? 'Você' : user}:</strong> ${text}`;
      }

      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    /* Lógica do Desafio X1 e Jogo da Velha */
    function challengeUser(targetId) {
      lobbyChannel.publish('challenge', {
        targetId: targetId,
        fromUser: myUsername
      });
      alert('Desafio enviado! Aguarde o oponente aceitar.');
    }

    function acceptChallenge() {
      document.getElementById('challenge-modal').style.display = 'none';
      const roomId = [myClientId, currentChallengerId].sort().join('-vs-');
      startX1Game(roomId, 'O', false); // Quem aceita joga com 'O' e é o segundo a jogar
      
      // Notifica o desafiante que aceitou
      lobbyChannel.publish('challenge_accepted', { roomId, toId: currentChallengerId });
    }

    function declineChallenge() {
      document.getElementById('challenge-modal').style.display = 'none';
      currentChallengerId = null;
    }

    // Escutar resposta do desafio aceito
    window.addEventListener('load', () => {
      setInterval(() => {
        if(lobbyChannel) {
          lobbyChannel.subscribe('challenge_accepted', (msg) => {
            if (msg.data.toId === myClientId) {
              startX1Game(msg.data.roomId, 'X', true); // Quem desafiou joga com 'X' e começa
            }
          });
        }
      }, 1000);
    });

    function startX1Game(roomId, symbol, turn) {
      currentGameRoom = roomId;
      mySymbol = symbol;
      isMyTurn = turn;
      boardState = Array(9).fill(null);

      gameChannel = ably.channels.get(`game-${roomId}`);
      
      document.querySelectorAll('.cell').forEach(cell => cell.innerText = '');
      document.getElementById('game-modal').style.display = 'flex';
      updateGameStatus();

      gameChannel.subscribe('move', (msg) => {
        if (msg.clientId !== myClientId) {
          boardState[msg.data.index] = msg.data.symbol;
          document.querySelectorAll('.cell')[msg.data.index].innerText = msg.data.symbol;
          isMyTurn = true;
          checkWinner();
          updateGameStatus();
        }
      });
    }

    function makeMove(index) {
      if (!isMyTurn || boardState[index] !== null) return;

      boardState[index] = mySymbol;
      document.querySelectorAll('.cell')[index].innerText = mySymbol;
      isMyTurn = false;

      gameChannel.publish('move', { index, symbol: mySymbol });
      
      checkWinner();
      updateGameStatus();
    }

    function updateGameStatus() {
      const statusText = document.getElementById('game-status');
      statusText.innerText = isMyTurn ? `Sua vez (${mySymbol})` : 'Aguardando oponente...';
    }

    function checkWinner() {
      const wins = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];

      for (let [a, b, c] of wins) {
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
          alert(boardState[a] === mySymbol ? 'Você venceu o X1!' : 'Você perdeu!');
          closeGame();
          return;
        }
      }

      if (!boardState.includes(null)) {
        alert('Empate!');
        closeGame();
      }
    }

    function closeGame() {
      document.getElementById('game-modal').style.display = 'none';
      if (gameChannel) gameChannel.unsubscribe();
    }
  </script>
</body>
</html>
