<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Tycoon - Mercado de Indústrias</title>
    <!-- Ably SDK para Multiplayer em Tempo Real -->
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Header / HUD */
        header {
            background: var(--card-bg); border-bottom: 1px solid var(--border);
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .player-info h1 { font-size: 18px; color: var(--text-main); }
        .player-info p { font-size: 12px; color: var(--text-muted); }
        .wallet { text-align: right; }
        .wallet .balance { font-size: 22px; font-weight: bold; color: var(--accent-green); }
        .wallet .net-worth { font-size: 12px; color: var(--text-muted); }

        /* Dashboard Container */
        .dashboard {
            display: grid; grid-template-columns: 1fr 320px; gap: 20px;
            padding: 20px; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%;
        }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
        }

        /* Seção do Mercado */
        .section-title { font-size: 16px; margin-bottom: 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        
        .industry-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px;
        }

        .industry-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
            padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }
        .industry-card:hover { transform: translateY(-2px); border-color: var(--accent); }

        .ind-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .ind-name { font-weight: bold; font-size: 16px; }
        .ind-sector { font-size: 10px; background: #312e81; color: #a5b4fc; padding: 3px 8px; border-radius: 12px; font-weight: 600; }
        
        .ind-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; margin: 8px 0; }
        .ind-details span { color: var(--text-muted); font-size: 11px; display: block; }
        .ind-details strong { color: var(--text-main); }

        .ind-owner { font-size: 12px; color: var(--accent); font-weight: 500; background: rgba(99, 102, 241, 0.1); padding: 4px 8px; border-radius: 6px; }

        .btn-buy {
            background: var(--accent); color: white; border: none; padding: 10px;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .btn-buy:hover { background: #4f46e5; }
        .btn-buy:disabled { background: var(--border); cursor: not-allowed; opacity: 0.6; }

        /* Painel Lateral (Chat e Jogadores) */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }

        .panel-box {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 15px; display: flex; flex-direction: column;
        }

        .chat-box { height: 300px; }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12px; margin-bottom: 10px; }
        .chat-msg { background: var(--bg-color); padding: 6px 10px; border-radius: 6px; border-left: 3px solid var(--accent); }
        .chat-msg.sys { border-left-color: var(--accent-green); color: var(--text-muted); }
        
        .chat-input { display: flex; gap: 8px; }
        .chat-input input { flex: 1; background: var(--bg-color); border: 1px solid var(--border); color: white; padding: 8px; border-radius: 6px; outline: none; }
        .chat-input button { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .ranking-list { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
        .ranking-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <div class="player-info">
            <h1 id="player-display">Investidor</h1>
            <p>Status: <span id="online-status" style="color: var(--accent-green)">Conectando...</span></p>
        </div>
        <div class="wallet">
            <div class="balance" id="balance-display">R$ 50.000.000</div>
            <div class="net-worth">Patrimônio: R$ <span id="networth-display">50.000.000</span></div>
        </div>
    </header>

    <div class="dashboard">
        <!-- Mercado de Indústrias -->
        <main>
            <div class="section-title">
                <h2>🏭 Mercado de Grandes Indústrias</h2>
                <span style="font-size: 12px; color: var(--text-muted)">Rendimento automático a cada 10s</span>
            </div>
            <div class="industry-grid" id="industry-grid">
                <!-- Cards de Indústrias gerados via JS -->
            </div>
        </main>

        <!-- Sidebar (Chat + Placar) -->
        <aside class="sidebar">
            <div class="panel-box chat-box">
                <div class="section-title">💬 Chat do Mercado</div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input">
                    <input type="text" id="chat-input" placeholder="Mensagem..." onkeypress="if(event.key==='Enter') sendChat()" />
                    <button onclick="sendChat()">Enviar</button>
                </div>
            </div>

            <div class="panel-box">
                <div class="section-title">🏆 Maiores Industriais</div>
                <div class="ranking-list" id="ranking-list">
                    <div class="ranking-item"><span>Você</span><strong id="rank-my-worth">R$ 50M</strong></div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // --- 1. CONFIGURAÇÃO DE JOGADOR E ESTADO ---
        const ABLY_KEY = 'SUA_API_KEY_DO_ABLY'; // Insira sua API Key do Ably para ativar o multiplayer real
        let playerName = localStorage.getItem('tycoon_name') || prompt("Nome da sua Holding / Investidor:") || "Holding_" + Math.floor(Math.random() * 899 + 100);
        localStorage.setItem('tycoon_name', playerName);
        document.getElementById('player-display').innerText = playerName;

        const myId = playerName + '_' + Math.random().toString(36).substring(2, 5);
        let myCash = 50000000; // Capital inicial: R$ 50 Milhões

        // --- 2. LISTA DE GRANDES INDÚSTRIAS REAIS ---
        const industries = {
            'schulz': { id: 'schulz', name: 'Schulz Compressores', sector: 'Metalmecânico', price: 25000000, income: 450000, owner: null },
            'whirlpool': { id: 'whirlpool', name: 'Whirlpool Corp', sector: 'Eletrodomésticos', price: 65000000, income: 1200000, owner: null },
            'nidec': { id: 'nidec', name: 'Nidec Global Appliance', sector: 'Motores & Compressores', price: 50000000, income: 900000, owner: null },
            'weg': { id: 'weg', name: 'WEG Equipamentos', sector: 'Eletreletrônico', price: 120000000, income: 2500000, owner: null },
            'tupy': { id: 'tupy', name: 'Tupy Fundição', sector: 'Metalurgia', price: 35000000, income: 600000, owner: null },
            'tigre': { id: 'tigre', name: 'Tigre Tubos e Conexões', sector: 'Construção', price: 40000000, income: 700000, owner: null },
            'embraco': { id: 'embraco', name: 'Embraco Compressors', sector: 'Refrigeração', price: 45000000, income: 800000, owner: null },
            'grendene': { id: 'grendene', name: 'Grendene Indústria', sector: 'Calçados', price: 30000000, income: 500000, owner: null }
        };

        // --- 3. RENDERIZAÇÃO DO MERCADO ---
        function renderMarket() {
            const grid = document.getElementById('industry-grid');
            grid.innerHTML = '';

            let totalAssetsValue = 0;

            Object.values(industries).forEach(ind => {
                if (ind.owner === playerName) {
                    totalAssetsValue += ind.price;
                }

                const card = document.createElement('div');
                card.className = 'industry-card';
                
                const isOwner = ind.owner === playerName;
                const ownerText = ind.owner ? (isOwner ? 'Sua Indústria' : ind.owner) : 'Disponível no Mercado';
                const buttonText = ind.owner ? (isOwner ? 'Sua Propriedade' : 'Comprar do Dono') : 'Adquirir Indústria';
                
                // Preço de recompra (20% mais caro se já tiver dono)
                const currentCost = ind.owner && !isOwner ? Math.floor(ind.price * 1.2) : ind.price;

                card.innerHTML = `
                    <div class="ind-header">
                        <div class="ind-name">${ind.name}</div>
                        <span class="ind-sector">${ind.sector}</span>
                    </div>
                    <div class="ind-details">
                        <div>
                            <span>VALOR DE MERCADO</span>
                            <strong>R$ ${formatMoney(currentCost)}</strong>
                        </div>
                        <div>
                            <span>LUCRO / 10s</span>
                            <strong style="color: var(--accent-green)">+R$ ${formatMoney(ind.income)}</strong>
                        </div>
                    </div>
                    <div class="ind-owner">👑 ${ownerText}</div>
                    <button class="btn-buy" 
                        ${isOwner || myCash < currentCost ? 'disabled' : ''} 
                        onclick="buyIndustry('${ind.id}')">
                        ${buttonText}
                    </button>
                `;
                grid.appendChild(card);
            });

            // Atualiza Carteira e Patrimônio
            document.getElementById('balance-display').innerText = 'R$ ' + formatMoney(myCash);
            const netWorth = myCash + totalAssetsValue;
            document.getElementById('networth-display').innerText = formatMoney(netWorth);
            document.getElementById('rank-my-worth').innerText = 'R$ ' + formatMoney(netWorth);
        }

        // --- 4. AÇÕES DO JOGO ---
        function buyIndustry(id) {
            const ind = industries[id];
            const currentCost = ind.owner ? Math.floor(ind.price * 1.2) : ind.price;

            if (myCash >= currentCost && ind.owner !== playerName) {
                const previousOwner = ind.owner;
                myCash -= currentCost;
                ind.owner = playerName;
                ind.price = currentCost; // O valor de mercado sobe após a compra

                logSys(`Você adquiriu a **${ind.name}** por R$ ${formatMoney(currentCost)}!`);

                // Notifica no Ably
                if (channel) {
                    channel.publish('trade', {
                        buyer: playerName,
                        seller: previousOwner,
                        industryId: id,
                        price: currentCost,
                        indName: ind.name
                    });
                }

                renderMarket();
            }
        }

        // Ciclo de rendimento passivo (A cada 10 segundos)
        setInterval(() => {
            let dividendos = 0;
            Object.values(industries).forEach(ind => {
                if (ind.owner === playerName) {
                    dividendos += ind.income;
                }
            });

            if (dividendos > 0) {
                myCash += dividendos;
                logSys(`Você recebeu **R$ ${formatMoney(dividendos)}** em dividendos industriais.`);
                renderMarket();
            }
        }, 10000);

        // --- 5. MULTIPLAYER COM ABLY ---
        let ably, channel;

        try {
            if (ABLY_KEY && ABLY_KEY !== 'SUA_API_KEY_DO_ABLY') {
                ably = new Ably.Realtime({ key: ABLY_KEY, clientId: myId });
                channel = ably.channels.get('industrial-market-v1');

                ably.connection.on('connected', () => {
                    document.getElementById('online-status').innerText = 'Online';
                    logSys('Conectado ao Mercado Financeiro Global.');
                });

                // Recebe Compras de Outros Jogadores
                channel.subscribe('trade', (msg) => {
                    const data = msg.data;
                    if (industries[data.industryId]) {
                        industries[data.industryId].owner = data.buyer;
                        industries[data.industryId].price = data.price;
                        
                        if (data.buyer !== playerName) {
                            logSys(`**${data.buyer}** comprou a **${data.indName}** por R$ ${formatMoney(data.price)}.`);
                        }
                        renderMarket();
                    }
                });

                // Chat
                channel.subscribe('chat', (msg) => {
                    if (msg.data.sender !== playerName) {
                        addChatMessage(msg.data.sender, msg.data.text);
                    }
                });
            } else {
                document.getElementById('online-status').innerText = 'Modo Local (Offline)';
            }
        } catch (e) {
            console.warn("Executando em modo singleplayer/local.");
        }

        // --- 6. CHAT E UTILITÁRIOS ---
        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (text) {
                addChatMessage(playerName, text);
                if (channel) {
                    channel.publish('chat', { sender: playerName, text: text });
                }
                input.value = '';
            }
        }

        function addChatMessage(sender, text) {
            const box = document.getElementById('chat-messages');
            box.innerHTML += `<div class="chat-msg"><b>${sender}:</b> ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function logSys(msg) {
            const box = document.getElementById('chat-messages');
            box.innerHTML += `<div class="chat-msg sys">⚙️ ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function formatMoney(amount) {
            return amount.toLocaleString('pt-BR');
        }

        // Inicializa o jogo na tela
        renderMarket();
    </script>
</body>
</html>
