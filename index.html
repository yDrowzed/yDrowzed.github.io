<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Maldito Desgraçado World</title>
  <!-- SDKs do Ably e Three.js via CDN -->
  <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #70b5ff;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* BLOQUEIO DE TELA PARA CELULAR EM PÉ */
    #portrait-warning {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #0f172a;
      color: #ffffff;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    #portrait-warning .icon {
      font-size: 3rem;
      margin-bottom: 0.8rem;
      animation: rotatePhone 2s infinite ease-in-out;
    }

    @keyframes rotatePhone {
      0%, 15% { transform: rotate(0deg); }
      50%, 65% { transform: rotate(-90deg); }
      100% { transform: rotate(-90deg); }
    }

    @media screen and (orientation: portrait) {
      #portrait-warning { display: flex !important; }
    }

    /* Container 3D Canvas */
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
      z-index: 1;
      cursor: crosshair;
    }

    #canvas-container canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* Overlay para Elementos 2D */
    #overlay-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* Tela de Login */
    #login-screen {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      padding: 1.2rem 1.8rem;
      border-radius: 18px;
      width: 85%; max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      z-index: 100;
      pointer-events: auto;
    }

    #login-screen h1 { margin-bottom: 0.2rem; font-size: 1.35rem; color: #0284c7; }
    #login-screen p { color: #64748b; font-size: 0.75rem; margin-bottom: 0.8rem; }

    input, button {
      width: 100%;
      padding: 0.6rem 0.9rem;
      margin-bottom: 0.6rem;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      outline: none;
      font-size: 0.85rem;
    }

    button {
      background: #22c55e;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      touch-action: manipulation;
    }

    button:hover { background: #16a34a; }

    /* Crosshair */
    #crosshair {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      width: 8px; height: 8px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #0284c7;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      pointer-events: none;
    }

    /* Joystick Virtual (Mobile) */
    #joystick-zone {
      display: none;
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: max(16px, env(safe-area-inset-left));
      width: 80px; height: 80px;
      background: rgba(255, 255, 255, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      z-index: 50;
      pointer-events: auto;
      backdrop-filter: blur(4px);
    }

    #joystick-knob {
      position: absolute;
      top: 50%; left: 50%;
      width: 36px; height: 36px;
      background: rgba(2, 132, 199, 0.9);
      border: 2px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    /* Botão de Pulo (Mobile) */
    #btn-jump-mobile {
      display: none;
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom));
      right: max(16px, env(safe-area-inset-right));
      width: 55px; height: 55px;
      background: rgba(34, 197, 94, 0.95);
      color: white;
      border: 2px solid #ffffff;
      border-radius: 50%;
      font-weight: bold;
      font-size: 0.7rem;
      z-index: 50;
      pointer-events: auto;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    #btn-jump-mobile:active { transform: scale(0.92); background: #16a34a; }

    /* HUD Inferior */
    #bottom-hud {
      display: none;
      position: absolute;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 210px);
      max-width: 360px;
      z-index: 50;
      gap: 6px;
      pointer-events: auto;
    }

    #chat-input {
      flex: 1;
      height: 36px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 2px solid #38bdf8;
      border-radius: 18px;
      padding: 0 12px;
      font-size: 0.8rem;
      color: #0f172a;
      outline: none;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      margin-bottom: 0;
    }

    .btn-challenge-hud {
      height: 36px;
      width: auto;
      background: #f59e0b;
      color: #000;
      border: none;
      border-radius: 18px;
      padding: 0 12px;
      font-weight: bold;
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(245, 158, 11, 0.3);
      margin-bottom: 0;
      white-space: nowrap;
    }

    /* Indicador Superior */
    #controls-tip {
      display: none;
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #334155;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      z-index: 50;
      text-align: center;
      white-space: nowrap;
      max-width: 70vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tags Flutuantes */
    .name-tag {
      position: absolute;
      transform: translate(-50%, -100%);
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      padding: 2px 7px;
      border-radius: 16px;
      font-size: 0.68rem;
      font-weight: bold;
      pointer-events: auto;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      gap: 5px;
      will-change: transform, left, top;
    }

    .btn-x1-tag {
      background: #f59e0b;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 1px 5px;
      font-size: 0.6rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Balões de Fala */
    .speech-bubble {
      position: absolute;
      transform: translate(-50%, -100%);
      background: #ffffff;
      color: #0f172a;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      max-width: 160px;
      word-break: break-word;
      pointer-events: none;
      border: 2px solid #38bdf8;
      animation: popIn 0.2s ease-out;
      will-change: transform, left, top;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -7px; left: 50%;
      transform: translateX(-50%);
      border-width: 7px 5px 0;
      border-style: solid;
      border-color: #38bdf8 transparent transparent transparent;
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -80%) scale(0.5); opacity: 0; }
      100% { transform: translate(-50%, -100%) scale(1); opacity: 1; }
    }

    /* Modais */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 200;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      padding: 1rem 1.2rem;
      border-radius: 16px;
      text-align: center;
      max-width: 300px;
      width: 85%;
      max-height: 90vh;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .grid-x1 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin: 0.6rem 0;
    }

    .cell {
      height: 45px;
      background: #f1f5f9;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: bold;
      color: #0284c7;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Alerta de Orientação -->
  <div id="portrait-warning">
    <div class="icon">📱🔄</div>
    <h2>Por favor, vire o celular!</h2>
    <p style="color: #94a3b8; margin-top: 6px; font-size: 0.85rem;">Maldito Desgraçado World exige o celular na horizontal.</p>
  </div>

  <!-- Tela de Login -->
  <div id="login-screen">
    <h1>Maldito Desgraçado World</h1>
    <p>Insira sua API Key do Ably e escolha um apelido para entrar no mundo.</p>
    <input type="password" id="ably-key" placeholder="API Key do Ably">
    <input type="text" id="username" placeholder="Seu Apelido">
    <button onclick="connectAbly()">Entrar no Mundo</button>
  </div>

  <!-- Crosshair -->
  <div id="crosshair"></div>

  <!-- Controles Tip -->
  <div id="controls-tip">🎮 Carregando controles...</div>

  <!-- Joystick & Botão de Pulo (Mobile) -->
  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>
  <div id="btn-jump-mobile" onclick="triggerJump()">🦘 PULAR</div>

  <!-- HUD Rodapé -->
  <div id="bottom-hud">
    <input type="text" id="chat-input" placeholder="Mensagem... (Enter envia)" onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="btn-challenge-hud" onclick="challengeCrosshairTarget()">⚡ Desafiar X1</button>
  </div>

  <!-- Canvas 3D & Overlay -->
  <div id="canvas-container"></div>
  <div id="overlay-container"></div>

  <!-- Modal Desafio X1 -->
  <div class="modal-overlay" id="challenge-modal">
    <div class="modal-card">
      <h3 id="challenge-text" style="color: #0f172a; font-size: 1rem;">Jogador te chamou pro X1!</h3>
      <p style="color: #64748b; margin: 0.3rem 0; font-size: 0.75rem;">Duelo de Jogo da Velha em tempo real.</p>
      <div style="display: flex; gap: 8px;">
        <button onclick="acceptChallenge()" style="background: #22c55e; padding: 0.4rem;">Aceitar</button>
        <button onclick="declineChallenge()" style="background: #ef4444; padding: 0.4rem;">Recusar</button>
      </div>
    </div>
  </div>

  <!-- Modal do Jogo X1 -->
  <div class="modal-overlay" id="game-modal">
    <div class="modal-card">
      <h2 id="game-status" style="color: #0284c7; font-size: 1rem;">Sua Vez</h2>
      <div class="grid-x1" id="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
      </div>
      <button onclick="closeGame()" style="background: #ef4444; padding: 0.4rem;">Sair do Duelo</button>
    </div>
  </div>

  <script>
    let ably, lobbyChannel, gameChannel;
    let myClientId, myUsername;
    let currentChallengerId = null;
    let mySymbol = 'X';
    let isMyTurn = false;
    let boardState = Array(9).fill(null);

    // THREE.JS & PHYSICS
    let scene, camera, renderer, floorMesh, gridHelper, raycaster;
    let players = {};
    let platforms = [];

    // OTIMIZAÇÃO: GEOMETRIAS COMPARTILHADAS (REUSO DE MEMÓRIA)
    let sharedHeadGeo, sharedBodyGeo, sharedArmGeo;

    const keys = { w: false, a: false, s: false, d: false, space: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };

    let playerVelY = 0;
    let isGrounded = true;
    const gravity = -0.015;
    const jumpForce = 0.32;

    let isPointerLocked = false;
    let isTouchDevice = false;
    let pitch = 0, yaw = 0;
    const avatarColors = [0x22c55e, 0x00a8ff, 0x9c88ff, 0xff7043, 0xe84393, 0xfbc531];

    let joystickVector = { x: 0, y: 0 };
    let joystickTouchId = null;
    let lookTouchId = null;
    let lastLookPos = { x: 0, y: 0 };

    // VETORES ESTÁTICOS PARA EVITAR GARBAGE COLLECTION
    const tempV = new THREE.Vector3();
    const tempForward = new THREE.Vector3();
    const tempRight = new THREE.Vector3();
    const tempMoveDir = new THREE.Vector3();
    const upAxis = new THREE.Vector3(0, 1, 0);

    // RASTREAMENTO DE MOVIMENTO REDE
    let lastSentPos = { x: 0, y: 0, z: 0, rot: 0 };

    async function connectAbly() {
      const apiKey = document.getElementById('ably-key').value.trim();
      myUsername = document.getElementById('username').value.trim();

      if (!apiKey || !myUsername) {
        alert('Preencha a API Key do Ably e o Apelido.');
        return;
      }

      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }

      myClientId = 'usr_' + Math.random().toString(36).substr(2, 7);
      ably = new Ably.Realtime({ key: apiKey, clientId: myClientId });

      ably.connection.on('connected', () => {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('bottom-hud').style.display = 'flex';
        document.getElementById('controls-tip').style.display = 'block';
        document.getElementById('crosshair').style.display = 'block';

        isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        initAblyLobby();
        init3DWorld();
        setupControls();
      });

      ably.connection.on('failed', () => alert('Falha ao conectar no Ably. Confira sua API Key.'));
    }

    // OTIMIZAÇÃO: CRIAÇÃO DE GEOMETRIAS LEVES COMPARTILHADAS
    function initSharedGeometries() {
      // Cabeça (Polígonos reduzidos de 32 para 12)
      sharedHeadGeo = new THREE.SphereGeometry(0.48, 12, 12);

      // Corpo (Lathe reduzido para 12 segmentos)
      const points = [];
      for (let i = 0; i <= 15; i++) {
        const t = i / 15;
        const radius = Math.sin(t * Math.PI * 0.82) * 0.68;
        points.push(new THREE.Vector2(radius, t * 1.0));
      }
      sharedBodyGeo = new THREE.LatheGeometry(points, 12);

      // Braços (Polígonos reduzidos de 16 para 8)
      sharedArmGeo = new THREE.SphereGeometry(0.2, 8, 8);
      sharedArmGeo.scale(1, 2.2, 1);
    }

    // MUNDO 3D
    function init3DWorld() {
      const container = document.getElementById('canvas-container');

      initSharedGeometries();

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x70b5ff);
      scene.fog = new THREE.FogExp2(0x70b5ff, 0.025);

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
      camera.rotation.order = 'YXZ';

      raycaster = new THREE.Raycaster();

      renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
      
      // OTIMIZAÇÃO: Capping PixelRatio em 1.25 max para evitar rendering em resolução Retina/4K pesada
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
      renderer.setSize(window.innerWidth, window.innerHeight);

      // OTIMIZAÇÃO DE SOMBRAS: BasicShadowMap + Resolução leve (512x512)
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.BasicShadowMap;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(20, 35, 20);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 512;
      dirLight.shadow.mapSize.height = 512;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 100;
      scene.add(dirLight);

      // Chão
      const floorGeo = new THREE.PlaneGeometry(1000, 1000);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
      floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.rotation.x = -Math.PI / 2;
      floorMesh.receiveShadow = true;
      scene.add(floorMesh);

      // Grid
      gridHelper = new THREE.GridHelper(200, 100, 0x64748b, 0xcbd5e1);
      gridHelper.position.y = 0.01;
      scene.add(gridHelper);

      // Parkour
      buildParkourCourse();

      window.addEventListener('resize', onWindowResize);

      createPlayerAvatar(myClientId, myUsername, avatarColors[0], true);
      animate3D();
    }

    function addParkourBlock(x, y, z, w, h, d, colorHex) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y + h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      platforms.push({
        xMin: x - w / 2, xMax: x + w / 2,
        zMin: z - d / 2, zMax: z + d / 2,
        topY: y + h
      });
    }

    function buildParkourCourse() {
      addParkourBlock(0, 0, -8, 4, 1.0, 4, 0x00bcd4);
      addParkourBlock(0, 0, -14, 3, 2.2, 3, 0xab47bc);
      addParkourBlock(5, 0, -18, 3, 3.5, 3, 0xff7043);
      addParkourBlock(11, 2.5, -18, 2.5, 1.2, 2.5, 0x26a69a);
      addParkourBlock(17, 4.0, -14, 2.5, 1.2, 2.5, 0xffca28);
      addParkourBlock(17, 5.5, -8, 2.5, 1.2, 2.5, 0xec4899);
      addParkourBlock(12, 7.0, -2, 4, 1.5, 4, 0x3b82f6);
      addParkourBlock(5, 8.5, 3, 2.2, 1.2, 2.2, 0x10b981);
      addParkourBlock(-1, 10.0, 3, 2.2, 1.2, 2.2, 0xf59e0b);
      addParkourBlock(-7, 11.5, -2, 2.2, 1.2, 2.2, 0xef4444);
      addParkourBlock(-7, 13.0, -9, 5, 1.5, 5, 0xffd700);
    }

    // RAYCASTING
    function raycastTargetPlayer(screenX, screenY) {
      if (!camera) return null;

      const mouse = new THREE.Vector2(
        (screenX / window.innerWidth) * 2 - 1,
        -(screenY / window.innerHeight) * 2 + 1
      );

      raycaster.setFromCamera(mouse, camera);

      const targetObjects = [];
      Object.keys(players).forEach(id => {
        if (id !== myClientId && players[id].mesh) {
          players[id].mesh.traverse(child => {
            child.userData.playerId = id;
            targetObjects.push(child);
          });
        }
      });

      const intersects = raycaster.intersectObjects(targetObjects);
      if (intersects.length > 0) {
        const hitId = intersects[0].object.userData.playerId;
        if (hitId && hitId !== myClientId) {
          return hitId;
        }
      }
      return null;
    }

    function challengeCrosshairTarget() {
      const targetId = raycastTargetPlayer(window.innerWidth / 2, window.innerHeight / 2);
      if (targetId) {
        challengeUser(targetId);
      } else {
        alert('Mire diretamente em um jogador ou clique nele no espaço 3D para desafiá-lo!');
      }
    }

    function triggerJump() {
      if (isGrounded) {
        playerVelY = jumpForce;
        isGrounded = false;
      }
    }

    function setupControls() {
      const tip = document.getElementById('controls-tip');

      if (isTouchDevice) {
        document.getElementById('joystick-zone').style.display = 'block';
        document.getElementById('btn-jump-mobile').style.display = 'flex';
        tip.innerHTML = '📱 Clique no jogador 3D ou mire nele para chamar pro X1!';
        setupTouchControls();
      } else {
        document.getElementById('joystick-zone').style.display = 'none';
        document.getElementById('btn-jump-mobile').style.display = 'none';
        tip.innerHTML = '🖱️ Clique em um jogador 3D para desafiá-lo | <b>WASD</b> | <b>Espaço</b>';
        setupMouseControls();
        setupKeyboardControls();
      }
    }

    function setupMouseControls() {
      const container = document.getElementById('canvas-container');

      container.addEventListener('click', (e) => {
        if (document.activeElement === document.getElementById('chat-input')) return;

        const hitId = raycastTargetPlayer(e.clientX, e.clientY);
        if (hitId) {
          challengeUser(hitId);
          return;
        }

        if (!isPointerLocked) {
          document.body.requestPointerLock();
        }
      });

      document.addEventListener('pointerlockchange', () => {
        isPointerLocked = (document.pointerLockElement === document.body);
      });

      document.addEventListener('mousemove', (e) => {
        if (!isPointerLocked) return;
        const sensitivity = 0.0022;
        yaw -= e.movementX * sensitivity;
        pitch -= e.movementY * sensitivity;
        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
      });
    }

    function setupKeyboardControls() {
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && document.activeElement !== document.getElementById('chat-input')) {
          if (document.pointerLockElement) document.exitPointerLock();
          document.getElementById('chat-input').focus();
          return;
        }

        if (document.activeElement === document.getElementById('chat-input')) return;

        if (e.code === 'Space') {
          triggerJump();
          e.preventDefault();
        }

        const key = e.key.toLowerCase();
        if (keys.hasOwnProperty(key)) keys[key] = true;
        if (e.key.startsWith('Arrow')) keys[e.key] = true;
      });

      window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (keys.hasOwnProperty(key)) keys[key] = false;
        if (e.key.startsWith('Arrow')) keys[e.key] = false;
      });
    }

    function setupTouchControls() {
      const joystickZone = document.getElementById('joystick-zone');
      const joystickKnob = document.getElementById('joystick-knob');

      window.addEventListener('touchstart', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const touch = e.changedTouches[i];

          if (touch.target.closest('#btn-jump-mobile, #bottom-hud, #login-screen, .modal-card, .btn-x1-tag')) continue;

          const hitId = raycastTargetPlayer(touch.clientX, touch.clientY);
          if (hitId) {
            challengeUser(hitId);
            return;
          }

          if (touch.clientX < window.innerWidth / 2 && joystickTouchId === null) {
            if (touch.clientY > window.innerHeight - 60 && touch.clientX > window.innerWidth / 3) continue;
            joystickTouchId = touch.identifier;
            updateJoystick(touch, joystickZone, joystickKnob);
          } else if (touch.clientX >= window.innerWidth / 2 && lookTouchId === null) {
            lookTouchId = touch.identifier;
            lastLookPos = { x: touch.clientX, y: touch.clientY };
          }
        }
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const touch = e.changedTouches[i];

          if (touch.identifier === joystickTouchId) {
            updateJoystick(touch, joystickZone, joystickKnob);
          } else if (touch.identifier === lookTouchId) {
            const dx = touch.clientX - lastLookPos.x;
            const dy = touch.clientY - lastLookPos.y;

            const touchSensitivity = 0.0035;
            yaw -= dx * touchSensitivity;
            pitch -= dy * touchSensitivity;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

            lastLookPos = { x: touch.clientX, y: touch.clientY };
          }
        }
      }, { passive: false });

      const resetTouch = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const touch = e.changedTouches[i];
          if (touch.identifier === joystickTouchId) {
            joystickTouchId = null;
            joystickVector = { x: 0, y: 0 };
            joystickKnob.style.transform = `translate(-50%, -50%)`;
          } else if (touch.identifier === lookTouchId) {
            lookTouchId = null;
          }
        }
      };

      window.addEventListener('touchend', resetTouch);
      window.addEventListener('touchcancel', resetTouch);
    }

    function updateJoystick(touch, zone, knob) {
      const rect = zone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = touch.clientX - centerX;
      let dy = touch.clientY - centerY;
      const maxRadius = rect.width / 2;

      const distance = Math.hypot(dx, dy);
      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      joystickVector.x = dx / maxRadius;
      joystickVector.y = dy / maxRadius;
    }

    // MODELAGEM 3D REUTILIZANDO GEOMETRIAS
    function createMalditoDesgracadoBuddyMesh(colorHex) {
      const group = new THREE.Group();

      const material = new THREE.MeshPhongMaterial({
        color: colorHex,
        shininess: 60
      });

      const head = new THREE.Mesh(sharedHeadGeo, material);
      head.position.y = 1.32;
      head.castShadow = true;
      group.add(head);

      const body = new THREE.Mesh(sharedBodyGeo, material);
      body.castShadow = true;
      group.add(body);

      const leftArm = new THREE.Mesh(sharedArmGeo, material);
      leftArm.position.set(0.5, 0.6, 0);
      leftArm.rotation.z = -Math.PI / 6;
      leftArm.castShadow = true;
      group.add(leftArm);

      const rightArm = new THREE.Mesh(sharedArmGeo, material);
      rightArm.position.set(-0.5, 0.6, 0);
      rightArm.rotation.z = Math.PI / 6;
      rightArm.castShadow = true;
      group.add(rightArm);

      return group;
    }

    function createPlayerAvatar(id, name, colorHex, isMe = false) {
      if (players[id]) return;

      const mesh = createMalditoDesgracadoBuddyMesh(colorHex);
      const spawnX = (Math.random() - 0.5) * 8;
      const spawnZ = (Math.random() - 0.5) * 8;
      mesh.position.set(spawnX, 0, spawnZ);

      if (isMe) mesh.visible = false;
      scene.add(mesh);

      let tag = null;
      if (!isMe) {
        const overlay = document.getElementById('overlay-container');
        tag = document.createElement('div');
        tag.className = 'name-tag';
        tag.innerHTML = `
          <span>${name}</span>
          <button class="btn-x1-tag" onclick="challengeUser('${id}')">⚡ X1</button>
        `;
        overlay.appendChild(tag);
      }

      players[id] = {
        mesh: mesh,
        targetPos: new THREE.Vector3(spawnX, 0, spawnZ),
        nameTag: tag,
        speechBubble: null,
        bubbleTimeout: null
      };
    }

    // RENDER LOOP & FÍSICA OTIMIZADA
    let lastBroadCast = 0;

    function animate3D() {
      requestAnimationFrame(animate3D);

      const myPlayer = players[myClientId];

      if (myPlayer) {
        myPlayer.mesh.rotation.y = yaw;

        let moveX = 0, moveZ = 0;

        if (isTouchDevice) {
          moveX = joystickVector.x;
          moveZ = joystickVector.y;
        } else {
          if (keys.w || keys.arrowup) moveZ -= 1;
          if (keys.s || keys.arrowdown) moveZ += 1;
          if (keys.a || keys.arrowleft) moveX -= 1;
          if (keys.d || keys.arrowright) moveX += 1;
        }

        if (Math.abs(moveX) > 0.05 || Math.abs(moveZ) > 0.05) {
          const speed = 0.15;
          tempForward.set(0, 0, -1).applyAxisAngle(upAxis, yaw);
          tempRight.set(1, 0, 0).applyAxisAngle(upAxis, yaw);

          tempMoveDir.set(0, 0, 0)
            .addScaledVector(tempForward, -moveZ)
            .addScaledVector(tempRight, moveX);

          if (tempMoveDir.lengthSq() > 1) tempMoveDir.normalize();

          myPlayer.mesh.position.addScaledVector(tempMoveDir, speed);
        }

        const px = myPlayer.mesh.position.x;
        const pz = myPlayer.mesh.position.z;
        let groundY = 0;

        for (let p of platforms) {
          if (px + 0.3 > p.xMin && px - 0.3 < p.xMax && pz + 0.3 > p.zMin && pz - 0.3 < p.zMax) {
            if (myPlayer.mesh.position.y >= p.topY - 0.3) {
              if (p.topY > groundY) groundY = p.topY;
            }
          }
        }

        playerVelY += gravity;
        myPlayer.mesh.position.y += playerVelY;

        if (myPlayer.mesh.position.y <= groundY) {
          myPlayer.mesh.position.y = groundY;
          playerVelY = 0;
          isGrounded = true;
        } else {
          isGrounded = false;
        }

        // OTIMIZAÇÃO REDE: Envia pacotes a 13Hz (a cada 75ms) APENAS SE HOUVER MOVIMENTO REAL
        const now = Date.now();
        const hasMoved = Math.abs(myPlayer.mesh.position.x - lastSentPos.x) > 0.005 ||
                         Math.abs(myPlayer.mesh.position.y - lastSentPos.y) > 0.005 ||
                         Math.abs(myPlayer.mesh.position.z - lastSentPos.z) > 0.005 ||
                         Math.abs(yaw - lastSentPos.rot) > 0.01;

        if (lobbyChannel && now - lastBroadCast > 75 && hasMoved) {
          lobbyChannel.publish('move3d', {
            id: myClientId,
            x: myPlayer.mesh.position.x,
            y: myPlayer.mesh.position.y,
            z: myPlayer.mesh.position.z,
            rot: yaw
          });
          lastSentPos = { x: myPlayer.mesh.position.x, y: myPlayer.mesh.position.y, z: myPlayer.mesh.position.z, rot: yaw };
          lastBroadCast = now;
        }

        camera.position.copy(myPlayer.mesh.position);
        camera.position.y += 1.35;
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        const snap = 2;
        gridHelper.position.x = Math.floor(myPlayer.mesh.position.x / snap) * snap;
        gridHelper.position.z = Math.floor(myPlayer.mesh.position.z / snap) * snap;
        floorMesh.position.x = myPlayer.mesh.position.x;
        floorMesh.position.z = myPlayer.mesh.position.z;
      }

      // ATUALIZAÇÃO 2D EFICIENTE DOS OUTROS JOGADORES
      Object.keys(players).forEach(id => {
        const p = players[id];

        if (id !== myClientId) {
          p.mesh.position.lerp(p.targetPos, 0.2);

          tempV.setFromMatrixPosition(p.mesh.matrixWorld);
          tempV.y += 2.1;
          tempV.project(camera);

          const isVisible = tempV.z < 1;

          if (isVisible) {
            const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
            const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;

            if (p.nameTag) {
              p.nameTag.style.display = 'flex';
              p.nameTag.style.left = `${x}px`;
              p.nameTag.style.top = `${y}px`;
            }

            if (p.speechBubble) {
              p.speechBubble.style.display = 'block';
              p.speechBubble.style.left = `${x}px`;
              p.speechBubble.style.top = `${y - 30}px`;
            }
          } else {
            if (p.nameTag) p.nameTag.style.display = 'none';
            if (p.speechBubble) p.speechBubble.style.display = 'none';
          }
        }
      });

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // BALÕES DE FALA
    function showSpeechBubble(playerId, text) {
      const p = players[playerId];
      if (!p) return;

      const overlay = document.getElementById('overlay-container');

      if (!p.speechBubble) {
        const bubble = document.createElement('div');
        bubble.className = 'speech-bubble';
        overlay.appendChild(bubble);
        p.speechBubble = bubble;
      }

      p.speechBubble.innerText = text;
      if (p.bubbleTimeout) clearTimeout(p.bubbleTimeout);

      p.bubbleTimeout = setTimeout(() => {
        if (p.speechBubble) {
          p.speechBubble.remove();
          p.speechBubble = null;
        }
      }, 6000);
    }

    // ABLY REDE
    function initAblyLobby() {
      lobbyChannel = ably.channels.get('hangout-lobby');

      lobbyChannel.presence.enter({ username: myUsername });
      lobbyChannel.presence.subscribe(() => updateOnlinePlayers());

      lobbyChannel.subscribe('chat', (msg) => {
        showSpeechBubble(msg.data.id, msg.data.text);
      });

      lobbyChannel.subscribe('move3d', (msg) => {
        if (msg.clientId !== myClientId && players[msg.data.id]) {
          players[msg.data.id].targetPos.set(msg.data.x, msg.data.y || 0, msg.data.z);
          players[msg.data.id].mesh.rotation.y = msg.data.rot;
        }
      });

      lobbyChannel.subscribe('challenge', (msg) => {
        if (msg.data.targetId === myClientId) {
          currentChallengerId = msg.clientId;
          if (document.pointerLockElement) document.exitPointerLock();
          document.getElementById('challenge-text').innerText = `${msg.data.fromUser} te chamou pro X1!`;
          document.getElementById('challenge-modal').style.display = 'flex';
        }
      });

      lobbyChannel.subscribe('challenge_accepted', (msg) => {
        if (msg.data.toId === myClientId) {
          if (document.pointerLockElement) document.exitPointerLock();
          startX1Game(msg.data.roomId, 'X', true);
        }
      });
    }

    async function updateOnlinePlayers() {
      const members = await lobbyChannel.presence.get();
      let colorIdx = 1;

      members.forEach((member) => {
        if (member.clientId === myClientId) return;

        if (!players[member.clientId]) {
          const color = avatarColors[colorIdx % avatarColors.length];
          createPlayerAvatar(member.clientId, member.data?.username || 'Jogador', color, false);
          colorIdx++;
        }
      });
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      lobbyChannel.publish('chat', { id: myClientId, text: text });
      input.value = '';
      input.blur();

      if (!isTouchDevice) document.body.requestPointerLock();
    }

    /* JOGO X1 */
    function challengeUser(targetId) {
      if (document.pointerLockElement) document.exitPointerLock();
      lobbyChannel.publish('challenge', { targetId: targetId, fromUser: myUsername });
      alert('Desafio de X1 enviado para o jogador!');
    }

    function acceptChallenge() {
      document.getElementById('challenge-modal').style.display = 'none';
      const roomId = [myClientId, currentChallengerId].sort().join('-vs-');
      startX1Game(roomId, 'O', false);
      lobbyChannel.publish('challenge_accepted', { roomId, toId: currentChallengerId });
    }

    function declineChallenge() {
      document.getElementById('challenge-modal').style.display = 'none';
      currentChallengerId = null;
    }

    function startX1Game(roomId, symbol, turn) {
      mySymbol = symbol;
      isMyTurn = turn;
      boardState = Array(9).fill(null);

      gameChannel = ably.channels.get(`game-${roomId}`);
      document.querySelectorAll('.cell').forEach(cell => cell.innerText = '');
      document.getElementById('game-modal').style.display = 'flex';
      updateGameStatus();

      gameChannel.subscribe('move', (msg) => {
        if (msg.clientId !== myClientId) {
          boardState[msg.data.index] = msg.data.symbol;
          document.querySelectorAll('.cell')[msg.data.index].innerText = msg.data.symbol;
          isMyTurn = true;
          checkWinner();
          updateGameStatus();
        }
      });
    }

    function makeMove(index) {
      if (!isMyTurn || boardState[index] !== null) return;

      boardState[index] = mySymbol;
      document.querySelectorAll('.cell')[index].innerText = mySymbol;
      isMyTurn = false;

      gameChannel.publish('move', { index, symbol: mySymbol });
      checkWinner();
      updateGameStatus();
    }

    function updateGameStatus() {
      document.getElementById('game-status').innerText = isMyTurn ? `Sua vez (${mySymbol})` : 'Vez do Oponente...';
    }

    function checkWinner() {
      const wins = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];

      for (let [a, b, c] of wins) {
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
          alert(boardState[a] === mySymbol ? '🏆 Você venceu o X1!' : '❌ Você perdeu!');
          closeGame();
          return;
        }
      }

      if (!boardState.includes(null)) {
        alert('🤝 Empate!');
        closeGame();
      }
    }

    function closeGame() {
      document.getElementById('game-modal').style.display = 'none';
      if (gameChannel) gameChannel.unsubscribe();
    }
  </script>
